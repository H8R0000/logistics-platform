resolver 127.0.0.11 valid=10s ipv6=off;

upstream management_api {
    zone management_api 64k;
    server shipment-management:8081 resolve;
}

upstream processing_api {
    zone processing_api 64k;
    server shipment-processing:8082 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;

    location /management/ {
        proxy_pass http://management_api/;
    }

    location /processing/ {
        proxy_pass http://processing_api/;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
