server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: courier-provider
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/courier_provider}
    username: ${DB_USERNAME:courier_provider}
    password: ${COURIER_DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/logistics}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/logistics/protocol/openid-connect/certs}
          audiences: logistics-api

courier:
  simulation:
    update-interval: 15s
    availability-probability: 0.6
    error-probability: 0
    response-delay: 0s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
