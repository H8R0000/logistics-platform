server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: shipment-processing
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/logistics}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/logistics/protocol/openid-connect/certs}
          audiences: logistics-api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
